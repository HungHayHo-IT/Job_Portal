apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-backend
  namespace: jobportal
  labels:
    app: jobportal-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jobportal-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: jobportal-backend

    spec:
      containers:
        - name: backend
          image: hunghayho/job-portal-backend:v1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: jobportal-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: jobportal-config
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jobportal-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jobportal-secret
                  key: JWT_SECRET

            - name: APP_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: jobportal-config
                  key: APP_CORS_ALLOWED_ORIGINS

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: jobportal-config
                  key: LOG_LEVEL

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi