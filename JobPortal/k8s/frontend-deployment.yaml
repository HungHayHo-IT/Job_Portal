apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-frontend
  namespace: jobportal
  labels:
    app: jobportal-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jobportal-frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: jobportal-frontend

    spec:
      containers:
        - name: frontend
          image: hunghayho/job-portal-frontend:v1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi