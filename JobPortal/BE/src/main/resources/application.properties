
spring.datasource.url=jdbc:mysql://localhost:3308/jobportaldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root


server.port =8082

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:sql/jobportal-schema.sql
spring.sql.init.data-locations=classpath:sql/jobportal-data.sql


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.docker.compose.enabled=false
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
logging.level.com.example.BE=${LOG_LEVEL:INFO}


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.forward-headers-strategy=framework

app.cors.allowed-origins=http://localhost:5173
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600


management.endpoint.health.show-details=always

management.endpoints.web.base-path=/actuator

management.endpoints.web.exposure.include=*
management.endpoint.configprops.show-values=always
management.endpoint.env.show-values=always

management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0

management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect



spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s