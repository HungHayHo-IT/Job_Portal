spring.application.name=job-portal-api

server.port=8082
server.forward-headers-strategy=framework


spring.profiles.default=local

spring.sql.init.mode=never


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false


spring.docker.compose.enabled=false


# Cookie
# ===============================

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# ===============================
# CORS defaults
# ===============================

app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===============================
# Actuator defaults
# ===============================

management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=never


management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never

# ===============================
# Console logging
# ===============================

logging.pattern.console=${CONSOLE_LOG_PATTERN:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n}
logging.level.com.example.BE=${LOG_LEVEL:INFO}



# ===============================
# Cache
# ===============================

cache.jobs.ttl-minutes=10
cache.jobs.max-size=5000
cache.companies.ttl-minutes=10
cache.companies.max-size=500
cache.roles.ttl-days=1
cache.roles.max-size=100