name: Publish Docker images to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/job-portal-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/job-portal-frontend

jobs:
  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: JobPortal/BE
          file: JobPortal/BE/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=jobportal-backend
          cache-to: type=gha,mode=max,scope=jobportal-backend

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: JobPortal/FE
          file: JobPortal/FE/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=jobportal-frontend
          cache-to: type=gha,mode=max,scope=jobportal-frontend